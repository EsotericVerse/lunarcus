name: Notify LOC only when a published LAS contract requires it

# The LAS Auth Worker is published by Cloudflare Workers Builds.
# A successful Auth production check does not imply the LOC site needs rebuilding.
# MCP publishing is independent/manual, and LAS Plugins/CMS mappings never trigger LOC.
on:
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      loc_deploy:
        description: 'Override the automatic LOC impact decision'
        type: choice
        required: true
        default: auto
        options: [auto, notify, skip]

permissions:
  contents: read

concurrency:
  group: las-to-loc-production
  cancel-in-progress: false

jobs:
  notify-loc:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'check_run' &&
       github.event.check_run.name == 'Workers Builds: lunarcus' &&
       github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
       github.event.check_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Classify independently deployable LAS modules and LOC impact
        id: impact
        env:
          GH_TOKEN: ${{ github.token }}
          LAS_SHA: ${{ github.event.check_run.head_sha }}
          LOC_DEPLOY_MODE: ${{ inputs.loc_deploy || 'auto' }}
        run: node scripts/resolve-las-deployment-impact.mjs
      - name: Trigger existing LOC Pages main build only if needed
        if: steps.impact.outputs.decision == 'notify'
        env:
          LOC_PAGES_DEPLOY_HOOK: ${{ secrets.LOC_PAGES_DEPLOY_HOOK }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$LOC_PAGES_DEPLOY_HOOK" ]]; then
            echo "LOC deploy hook not configured; LOC will consume the published LAS service on its next normal deployment."
            exit 0
          fi
          if [[ "$LOC_PAGES_DEPLOY_HOOK" != https://api.cloudflare.com/client/v4/pages/webhooks/deploy_hooks/* ]]; then
            echo "::error::Invalid Cloudflare Pages deploy hook format"
            exit 1
          fi
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 30 --request POST \
            "$LOC_PAGES_DEPLOY_HOOK" > /dev/null
          echo "Requested one existing LOC Pages/main build (no LOC Git push)"
