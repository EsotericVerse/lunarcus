name: Validate LAS Auth (Cloudflare Builds deploys)
on:
  push:
    branches: [main]
    paths:
      - 'wrangler.jsonc'
      - 'vendor/loc-dialect/**'
      - 'scripts/test-las-dialect.mjs'
      - 'services/workers/lunarcus/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-migration-contract.mjs'
      - 'scripts/test-las-auth-http.mjs'
      - '.github/workflows/deploy-lunarcus-auth.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: las-auth-verify
  cancel-in-progress: true
jobs:
  auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - name: Install locked LAS dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Worker identity and root deployment config
        run: node scripts/check-migration-contract.mjs
      - name: Validate LAS Auth runtime
        run: npm run check:auth
      - name: Build default root Worker without publishing
        run: npx --yes wrangler@4.157.0 deploy --dry-run --outdir /tmp/las-auth-check
