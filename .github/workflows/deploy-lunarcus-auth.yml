name: Deploy LAS Auth (verify then publish)
on:
  push:
    branches: [main]
    paths:
      - 'wrangler.jsonc'
      - 'vendor/loc-dialect/**'
      - 'scripts/test-las-dialect.mjs'
      - 'services/workers/lunarcus/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-migration-contract.mjs'
      - 'scripts/test-module-boundaries.mjs'
      - 'scripts/test-las-auth-http.mjs'
      - '.github/workflows/deploy-lunarcus-auth.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: las-auth-deploy
  cancel-in-progress: true
jobs:
  auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - name: Install locked LAS dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Worker identity and root deployment config
        run: node scripts/check-migration-contract.mjs
      - name: Validate LAS Auth runtime and module ownership
        run: npm run check:auth && node --test scripts/test-module-boundaries.mjs
      - name: Build default root Worker without publishing
        run: npx --yes wrangler@4.157.0 deploy --dry-run --outdir /tmp/las-auth-check
      - name: Require LAS Cloudflare deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::CLOUDFLARE_API_TOKEN must be configured in LAS repository Actions secrets.'
            exit 1
          fi
      - name: Deploy existing lunarcus Auth Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f730f29a620a25bb047a69d542457fc0
        run: npm run auth:deploy
