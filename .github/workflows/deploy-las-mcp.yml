name: Deploy LAS MCP Worker
on:
  push:
    branches: [main]
    paths:
      - 'services/workers/las-mcp/**'
      - 'app/las/mcp/**'
      - '.github/workflows/deploy-las-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: las-mcp-deploy
  cancel-in-progress: true

jobs:
  mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: f730f29a620a25bb047a69d542457fc0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - name: Require authorized deployment token
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::LAS repository lacks Cloudflare API Token"; exit 1; }
      - name: Install minimal LAS dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate gateway contract
        run: npm run check:mcp
      - name: Validate actual worker bundle
        run: npm run mcp:dry-run
      - name: Publish LAS MCP Worker WITHOUT custom-domain takeover
        run: npx --yes wrangler@4.157.0 deploy --config services/workers/las-mcp/wrangler.jsonc
      - name: Confirm safe staging
        run: echo 'LAS MCP Worker deployed without mcp.lo3rwang.cc route. LOC Pages remains in production.'
