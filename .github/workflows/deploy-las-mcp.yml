name: Deploy LAS MCP Worker
on:
  push:
    branches: [main]
    paths:
      - 'services/workers/las-mcp/**'
      - 'app/las/mcp/**'
      - '.github/workflows/deploy-las-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: las-mcp-deploy
  cancel-in-progress: true

jobs:
  mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.LOC_WORKFLOW_KEY }}
      CLOUDFLARE_ACCOUNT_ID: f730f29a620a25bb047a69d542457fc0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - name: Verify LAS MCP target and existing workflow credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::LAS LOC_WORKFLOW_KEY is unavailable to this workflow"
            exit 1
          fi
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const config=JSON.parse(readFileSync('services/workers/las-mcp/wrangler.jsonc','utf8'));
          assert.equal(config.name,'las-mcp');
          assert.equal(config.workers_dev,false);
          assert.deepEqual(config.routes,[{
            pattern:'mcp.lo3rwang.cc',custom_domain:true,zone_name:'lo3rwang.cc'
          }]);
          NODE
      - name: Install minimal LAS dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate gateway contract
        run: npm run check:mcp
      - name: Validate actual worker bundle
        run: npm run mcp:dry-run
      - name: Publish LAS MCP Worker to transferred custom domain
        run: npx --yes wrangler@4.157.0 deploy --config services/workers/las-mcp/wrangler.jsonc
      - name: Confirm target intent
        run: echo 'LAS MCP deployment targeted las-mcp and transferred mcp.lo3rwang.cc only; verify live route separately.'
