name: Verify MCP in existing LunArcus Worker (no second deployment)
on:
  pull_request:
    paths:
      - 'app/las/**'
      - 'app/las/mcp/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-las-mcp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mcp-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:auth && npm run check:mcp
      - run: npm run auth:dry-run
      - name: No standalone MCP deployment
        run: echo 'Cloudflare Workers Builds deploys existing lunarcus for both auth and MCP domains.'
