name: LAS syntax and file count guard
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Count tracked LAS files
        shell: bash
        run: |
          set -euo pipefail
          count="$(git ls-files | wc -l)"
          echo "LAS tracked files: $count"
          test "$count" -le 200
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do
            case "$path" in
              *.js|*.mjs|*.cjs) node --check "$path" ;;
            esac
          done < <(git ls-files -z)
