name: LAS syntax and file count guard
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Count tracked LAS files only
        shell: bash
        run: |
          set -euo pipefail
          count="$(git ls-files | wc -l)"
          echo "LAS tracked files: $count"
          test "$count" -le 200
      - name: Validate JavaScript and JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do
            case "$path" in
              *.js|*.mjs|*.cjs) node --check "$path" ;;
              *.json|*.jsonc) node -e "JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8'))" "$path" ;;
            esac
          done < <(git ls-files -z)
      - name: Validate workflow YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -rpsych -e 'ARGV.each { |f| Psych.parse_file(f) }' .github/workflows/*.yml
