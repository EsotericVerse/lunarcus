name: Verify LAS server runtime (no deployment)
on:
  pull_request:
    paths:
      - 'app/las/**'
      - 'plugins/chrome/**'
      - 'public/plugins/chrome/oauth/**'
      - 'scripts/test-extension-*.mjs'
      - 'scripts/test-las-conversation-*.mjs'
      - 'vendor/loc-dialect/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/test-las-auth-http.mjs'
      - 'scripts/test-las-mcp-*.mjs'
      - '.github/workflows/check-lunarcus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - name: Install LAS server dependencies without lifecycle hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify LAS Auth, MCP and client Queue locally
        run: npm run check:auth && npm run check:mcp && npm run check:extension
      - name: Verify existing Worker bundle without publishing
        run: npx --yes wrangler@4.157.0 deploy --dry-run
