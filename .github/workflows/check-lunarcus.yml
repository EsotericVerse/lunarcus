name: Check LunArcus Auth and Extension
on:
  pull_request:
    paths:
      - 'vendor/loc-dialect/**'
      - 'scripts/test-las-dialect.mjs'
      - 'services/workers/lunarcus/**'
      - 'services/workers/las-mcp/**'
      - 'app/las/mcp/**'
      - 'app/las/tunnel/**'
      - 'plugins/chrome/**'
      - 'public/plugins/chrome/oauth/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-lunarcus-auth.yml'
      - '.github/workflows/deploy-las-mcp.yml'
      - '.github/workflows/notify-loc-after-auth.yml'
      - 'scripts/test-las-deployment-notify.mjs'
      - 'docs/MODULE-ARCHITECTURE.md'
      - 'AGENTS.md'
      - '.agents/**'
      - '.github/skills/**'
      - 'scripts/check-las-agent-skills.mjs'
      - 'docs/MCP-BOUNDARY.md'
      - 'docs/ISR-HANDOFF.md'
      - 'scripts/test-module-boundaries.mjs'
      - 'scripts/test-las-mcp-worker-http.mjs'
      - 'scripts/test-las-extension-direct-import.mjs'
      - 'scripts/test-las-auth-http.mjs'
      - 'scripts/check-migration-contract.mjs'
      - '.github/workflows/check-lunarcus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - name: Verify LAS-local Skills and agent rules
        run: node scripts/check-las-agent-skills.mjs
      - name: Verify LAS skills are discoverable by Claude without copying
        run: npm run skills:sync && node scripts/check-las-agent-skills.mjs
      - name: Install minimal PostgreSQL Auth dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate repo ownership, extension ID and immutable domains
        run: node scripts/check-migration-contract.mjs
      - name: Check LunArcus Worker and Extension syntax
        run: npm run check:auth && npm run check:extension
      - name: Validate MCP runtime contract and mapping
        run: npm run check:mcp
      - name: Enforce module names and LOC-owned IPA boundary
        run: node --test scripts/test-module-boundaries.mjs
      - name: Validate LAS to LOC deployment signal contract
        run: node --test scripts/test-las-deployment-notify.mjs
      - name: Dry-run Worker bundles (never publish)
        run: npm run auth:dry-run && npm run mcp:dry-run
