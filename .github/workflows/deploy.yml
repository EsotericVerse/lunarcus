name: LAS build verification (GitHub only)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# GitHub owns source and build validation only. Cloudflare's connected
# Workers Builds integration independently owns production/preview deployment.
# No API token, Wrangler upload, domain route or external dispatch from GitHub.
permissions:
  contents: read

concurrency:
  group: las-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - name: Install LAS Worker dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check isolated Worker deployment configuration
        shell: bash
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
            if(cfg.name!=='lunarcus'||cfg.workers_dev!==true||
               cfg.preview_urls!==true||Object.hasOwn(cfg,'routes')||
               Object.hasOwn(cfg,'route')||Object.hasOwn(cfg,'zone_id'))
              throw Error('LAS must not declare a custom domain or zone route');
          "
      - name: Verify Worker bundle without deploying
        run: npx --yes wrangler@4.157.0 deploy --dry-run --outdir dist --config wrangler.jsonc --name lunarcus
