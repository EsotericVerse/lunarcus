name: LAS GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub publishes static assets only. DNS and backend services are external.
# No Cloudflare token, Wrangler, Worker route, or Preview deploy.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: las-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assemble static site
        run: |
          mkdir -p dist/pages
          cp -R public/. dist/pages/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish static assets to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
