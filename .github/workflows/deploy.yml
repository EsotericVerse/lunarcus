name: LAS production deploy
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: las-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - name: Install LAS Worker dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deploy LAS Worker once
        run: npx --yes wrangler@4.157.0 deploy --config wrangler.jsonc --name lunarcus
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
