name: LAS Build
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Entire LAS repository; no path include/exclude filters.
# Cloudflare's own Git integration owns branch previews and main production.
# GitHub has no Cloudflare token, DNS grants, deploy calls or LOC triggers.
permissions:
  contents: read

concurrency:
  group: las-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - name: Install LAS dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build LAS Worker from its own source
        run: npm run build
