name: LAS manual deployment
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: las-manual-deploy
  cancel-in-progress: false

jobs:
  build-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - name: Install LAS dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile and link LAS Worker bundle only
        run: |
          npm run build
          test -s dist/index.js || find dist -type f -size +0c -print -quit | grep -q .
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Install LAS Worker dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deploy only LAS Worker
        run: npx --yes wrangler@4.157.0 deploy --name lunarcus
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.LAS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
