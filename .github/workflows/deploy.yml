name: LAS Build
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cloudflare Git integration owns branch previews and production deployment.
# GitHub checks source/bundle only; it holds no Cloudflare deploy token.
permissions:
  contents: read

concurrency:
  group: las-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - name: Install LAS dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build isolated LAS import container
        run: docker build --pull -f containers/plugin-import/Dockerfile -t las-plugin-import:ci .
      - name: Verify MCP protocol boundaries
        run: npm test
      - name: Bundle LAS Worker without publishing
        run: npm run build
