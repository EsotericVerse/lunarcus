name: LAS manual deployment
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: las-manual-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Install LAS Worker dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deploy only LAS Worker
        run: npx --yes wrangler@4.157.0 deploy --name lunarcus
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.LAS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
